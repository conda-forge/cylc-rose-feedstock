{% set name = "cylc-rose" %}
{% set version = "1.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/05/f1/fba9e533bf61d628bd3f7737481d17846e3266891dc06071bf2d64f15b5a/cylc_rose-{{ version }}.tar.gz
  sha256: 1f9b4c4439f45cf0caf8a237130ce5e2de16e730a8d456c0b2d4a6aec8b30fbf

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --ignore-installed

requirements:
  host:
    - __unix
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - __unix
    - python >={{ python_min }}
    - metomi-rose-base >=2.6,<2.8
    - cylc-flow-base >=8.6,<8.7
    - metomi-isodatetime
    - ansimarkup
    - jinja2

test:
  requires:
    - python {{ python_min }}
  imports:
    - cylc.flow
    - cylc.rose
    - metomi.rose
  commands:
    - PAGER=cat rose stem --help

about:
  home: https://github.com/cylc/cylc-rose
  license: GPL-3.0-only
  license_family: GPL
  license_file: COPYING
  summary: Cylc Rose is the bridge between Rose suite configurations and Cylc workflows.
  description: |
    Cylc Rose is a replacement for the rose suite-run command (present in Rose
    versions 2019.01 and earlier). It reads the rose-suite.conf file and
    performs the required actions.
  doc_url: https://cylc.github.io/cylc-doc/latest/html/plugins/cylc-rose.html
  dev_url: https://github.com/cylc/cylc-rose

extra:
  recipe-maintainers:
    - jfrost-mo
    - hjoliver
    - oliver-sanders
    - metronnie
