{% set name = "cylc-rose" %}
{% set version = "1.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/1e/8b/3efc874f8eedb216f62cda7dfd17a379198a734f76f2e0d219921fa0c294/cylc_rose-{{ version }}.tar.gz
  sha256: 671d7ee00efc58d8021a19421e536e551f0c5cf0efb283eb311cd2238531c558

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --ignore-installed

requirements:
  host:
    - __unix
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - __unix
    - python >={{ python_min }}
    - metomi-rose-base >=2.8,<2.9
    - cylc-flow-base >=8.7,<8.8
    - metomi-isodatetime
    - ansimarkup
    - jinja2

test:
  requires:
    - python {{ python_min }}
  imports:
    - cylc.flow
    - cylc.rose
    - metomi.rose
  commands:
    - PAGER=cat rose stem --help

about:
  home: https://github.com/cylc/cylc-rose
  license: GPL-3.0-only
  license_family: GPL
  license_file: COPYING
  summary: Cylc Rose is the bridge between Rose suite configurations and Cylc workflows.
  description: |
    Cylc Rose is a replacement for the rose suite-run command (present in Rose
    versions 2019.01 and earlier). It reads the rose-suite.conf file and
    performs the required actions.
  doc_url: https://cylc.github.io/cylc-doc/latest/html/plugins/cylc-rose.html
  dev_url: https://github.com/cylc/cylc-rose

extra:
  recipe-maintainers:
    - jfrost-mo
    - hjoliver
    - oliver-sanders
    - metronnie
